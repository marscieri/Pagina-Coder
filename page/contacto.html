    <h1 class="ts-page-title">CONTACTO</h1>

  <!-- CONTENIDO -->
  <main>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">

            <h2 class="ts-section-title text-center mb-2">Mandanos un mensaje</h2>
            <p class="text-center ts-subtitle mb-5">Completá el formulario y te respondemos lo antes posible.</p>

              <div class="mb-3">

                <label for="email" class="ts-label">Email</label>
                <input type="email" class="form-control ts-input" id="email" placeholder="tu@email.com">

              <div class="mb-3">
                <label for="asunto" class="ts-label">Asunto</label>
                <input type="text" class="form-control ts-input" id="asunto" placeholder="¿De qué querés hablar?">
              </div>
              <div class="mb-4">
                <label for="mensaje" class="ts-label">Mensaje</label>
                <textarea class="form-control ts-input" id="mensaje" rows="5" placeholder="Escribí tu mensaje acá..."></textarea>
              </div>
              <div class="text-center">
                <button type="submit" class="ts-btn">Enviar Mensaje</button>
              </div>
            </form>

            <div class="text-center mt-5">
              <h3 class="ts-section-title mb-3">Redes sociales</h3>
